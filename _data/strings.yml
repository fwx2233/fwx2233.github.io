# Strings
# =======================================================================================
# This file contains all soft-coded strings of the theme.
# You can edit them here if you want to change the wording of certain phrases,
# e.g. maybe you prefer "Fetching…" to "Loading…", etc.
#
# You can also use this to "translate" the theme into different langauges,
# but note that this may not work in all situations,
# especially for languages that differ significantly from English.

# Free version
# ---------------------------------------------------------------------------------------
home:                  首页
pages:                 页面
posts:                 文章
about:                 关于我
related_posts:         相关文章
other_projects:        其他项目
comments:              评论
jump_to:               跳转到
navigation:            导航
social:                联系方式
links:                 链接
pagination:            分页
newer:                 较新文章
older:                 较早文章
back:                  返回
permalink:             永久链接
permalink_icon:        icon-link
templates:             页面交互模板

loading:               加载中…
redirecting:           跳转中…

continue_reading:      >
  继续阅读 <!--post_title-->

cookies_banner:
  text:                >
    This site uses cookies. [Cookies Policy](/hydejack/cookies-policy/).
  okay:                Okay

not_found:
  title:               '404：页面未找到'
  message:             |
    这个地址对应的页面不存在或已经移动。
    你可以<!--home_link-->，查找其他文章。
  home_link:           返回首页

error:
  title:               加载失败
  message:             |
    加载 <!--link--> 时发生错误，请刷新页面后重试。

# Separators
# ---------------------------------------------------------------------------------------
colon:                 ':'
separator:             '|'
category_start:        '分类：'
category_separator:    ' / '
tag_start:             '标签：'
tag_separator:         ', '


# Date formats
# ---------------------------------------------------------------------------------------
date_formats:
  post:                '%Y年%m月%d日'
  related_post:        '%Y年%m月%d日'
  list_group_by:       '%Y'
  list_entry:          '%m月%d日'
  project:             '%Y'
  projects_group_by:   '%Y'
  resume:              '%b %Y'


